<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VITB Sport</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%23f43f5e'/><stop offset='50%' stop-color='%238b5cf6'/><stop offset='100%' stop-color='%233b82f6'/></linearGradient></defs><rect width='32' height='32' rx='6' fill='url(%23g)'/><text x='16' y='23' text-anchor='middle' font-family='Arial Black,sans-serif' font-size='20' font-weight='900' fill='white'>V</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #f43f5e, #8b5cf6, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .tagline {
      font-size: 1.25rem;
      color: #94a3b8;
      margin-top: 1rem;
      max-width: 500px;
    }
    .links {
      margin-top: 3rem;
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .links a {
      color: #94a3b8;
      text-decoration: none;
      padding: 0.5rem 1.5rem;
      border: 1px solid #334155;
      border-radius: 2rem;
      transition: all 0.3s;
    }
    .links a:hover {
      color: #f1f5f9;
      border-color: #8b5cf6;
      background: rgba(139, 92, 246, 0.1);
    }
    footer {
      position: fixed;
      bottom: 2rem;
      color: #475569;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <h1 class="logo">VITB SPORT</h1>
  <p class="tagline">Your ultimate destination for sports updates, insights, and community.</p>
  <nav class="links">
    <a href="#">News</a>
    <a href="#">Scores</a>
    <a href="#">Community</a>
    <a href="#">About</a>
  </nav>
  <footer>&copy; 2026 VITB Sport. All rights reserved.</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VITB Sport</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236b8099'/><path d='M7 9.5 C10 8 13 8 16 10 C19 8 22 8 25 9.5 V22.5 C22 21 19 21 16 23 C13 21 10 21 7 22.5 Z' fill='none' stroke='%23e8eef5' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/><line x1='16' y1='10' x2='16' y2='23' stroke='%23e8eef5' stroke-width='1.6' stroke-linecap='round'/></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #f43f5e, #8b5cf6, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .tagline {
      font-size: 1.25rem;
      color: #94a3b8;
      margin-top: 1rem;
      max-width: 500px;
    }
    .links {
      margin-top: 3rem;
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .links a {
      color: #94a3b8;
      text-decoration: none;
      padding: 0.5rem 1.5rem;
      border: 1px solid #334155;
      border-radius: 2rem;
      transition: all 0.3s;
    }
    .links a:hover {
      color: #f1f5f9;
      border-color: #8b5cf6;
      background: rgba(139, 92, 246, 0.1);
    }
    footer {
      position: fixed;
      bottom: 2rem;
      color: #475569;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <h1 class="logo">VITB SPORT</h1>
  <p class="tagline">Your ultimate destination for sports updates, insights, and community.</p>
  <nav class="links">
    <a href="#">News</a>
    <a href="#">Scores</a>
    <a href="#">Community</a>
    <a href="#">About</a>
  </nav>
  <footer>&copy; 2026 VITB Sport. All rights reserved.</footer>
</body>
</html>

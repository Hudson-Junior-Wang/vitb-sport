<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101714">
  <meta name="description" content="VITB Sport — 简洁、私密的训练、运动、饮食与身体数据记录工具。">
  <title>VITB Sport · 训练与运动记录</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23101714'/%3E%3Cpath d='M18 38V26m7 17V21m14 22V21m7 17V26M13 32h38' stroke='%23b7f36b' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主要导航">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M7 19v-6m4 9V10m10 12V10m4 9v-6M4 16h24"/></svg>
        </span>
        <span><strong>VITB</strong><small>SPORT</small></span>
      </div>

      <nav class="primary-nav">
        <p class="nav-label">训练中心</p>
        <button class="nav-item is-active" type="button" data-view="dashboard">
          <span aria-hidden="true">⌂</span><span>首页</span>
        </button>
        <button class="nav-item" type="button" data-view="training">
          <span aria-hidden="true">▰</span><span>训练记录</span>
        </button>
        <button class="nav-item" type="button" data-view="activities">
          <span aria-hidden="true">↗</span><span>运动记录</span>
        </button>
        <button class="nav-item" type="button" data-view="plans">
          <span aria-hidden="true">□</span><span>训练计划</span>
        </button>

        <p class="nav-label">健康数据</p>
        <button class="nav-item" type="button" data-view="nutrition">
          <span aria-hidden="true">◒</span><span>饮食记录</span>
        </button>
        <button class="nav-item" type="button" data-view="body">
          <span aria-hidden="true">◇</span><span>身体数据</span>
        </button>
        <button class="nav-item" type="button" data-view="analytics">
          <span aria-hidden="true">⌁</span><span>数据分析</span>
        </button>

        <p class="nav-label">空间</p>
        <button class="nav-item" type="button" data-view="members">
          <span aria-hidden="true">◎</span><span>Betty / Stephen</span>
        </button>
        <button class="nav-item" type="button" data-view="privacy">
          <span aria-hidden="true">◉</span><span>隐私与数据</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="storage-card">
          <span class="status-dot" aria-hidden="true"></span>
          <div><strong>仅保存在本机</strong><small>未连接云端 · 可随时导出</small></div>
        </div>
      </div>
    </aside>

    <button class="sidebar-scrim" id="sidebar-scrim" type="button" aria-label="关闭导航"></button>

    <div class="workspace">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobile-menu" type="button" aria-label="打开导航" aria-controls="sidebar" aria-expanded="false">☰</button>
        <div class="today-label">
          <small id="today-weekday">今天</small>
          <strong id="today-date">—</strong>
        </div>
        <div class="topbar-actions">
          <span class="local-badge"><span class="status-dot"></span>本地模式</span>
          <div class="profile-switch" aria-label="切换个人界面">
            <button class="profile-option" type="button" data-action="select-member" data-id="betty"><span>B</span><strong>Betty</strong></button>
            <button class="profile-option" type="button" data-action="select-member" data-id="stephen"><span>S</span><strong>Stephen</strong></button>
          </div>
        </div>
      </header>

      <main id="main-content" tabindex="-1">
        <div id="view-root" aria-live="polite"></div>
      </main>
    </div>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

  <dialog class="confirm-dialog" id="confirm-dialog">
    <form id="confirm-form">
      <span class="dialog-icon" aria-hidden="true">!</span>
      <h2 id="confirm-title">确认操作</h2>
      <p id="confirm-message"></p>
      <div class="dialog-actions">
        <button class="button button-quiet" id="confirm-cancel" type="button">取消</button>
        <button class="button button-danger" id="confirm-ok" type="button">确认</button>
      </div>
    </form>
  </dialog>

  <noscript>
    <div class="noscript">此应用需要 JavaScript 才能保存和展示本地训练数据。</div>
  </noscript>
</body>
</html>
